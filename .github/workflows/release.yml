name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    # Hoisted to job level so the signing step's `if:` can test it — the
    # `secrets` context is not available in a step-level `if`, but `env` is.
    env:
      SIGNING_CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The version is whatever Cargo.toml says — bump it there to cut a new
      # release (1.0.1 -> 1.0.2). It used to be rewritten to 0.0.<run number> on
      # every push, which made version numbers meaningless and could not
      # express a 1.0 release at all.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Cargo.toml version '$ver' is not MAJOR.MINOR.PATCH" }
          $tag = "v$ver"
          # A tag that is already released means this push did not change the
          # version (a docs fix, say): do not rebuild or replace that release.
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          $exists = ($LASTEXITCODE -eq 0).ToString().ToLower()
          $global:LASTEXITCODE = 0
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "exists=$exists" >> $env:GITHUB_OUTPUT
          echo "Version: $tag (already released: $exists)"

      - name: Build release
        if: ${{ steps.version.outputs.exists != 'true' }}
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Delete existing latest tag
        if: ${{ steps.version.outputs.exists != 'true' }}
        shell: pwsh
        run: |
          git tag -d latest 2>$null; exit 0
          git push origin :refs/tags/latest 2>$null; exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage release artifact
        if: ${{ steps.version.outputs.exists != 'true' }}
        run: Copy-Item target\x86_64-pc-windows-msvc\release\unreal_devtool.exe unreal_devtool.exe

      # Published alongside the exe so the in-app updater can verify what it
      # downloaded before installing it (see ops/update.rs), and so anyone can
      # independently confirm a download matches the release.
      - name: Compute SHA-256
        if: ${{ steps.version.outputs.exists != 'true' }}
        id: hash
        run: |
          $h = (Get-FileHash unreal_devtool.exe -Algorithm SHA256).Hash.ToLower()
          "$h  unreal_devtool.exe" | Set-Content -NoNewline -Encoding ascii unreal_devtool.exe.sha256
          echo "sha=$h" >> $env:GITHUB_OUTPUT
          echo "SHA-256: $h"

      # Authenticode signing. An unsigned binary is the root cause of the
      # SmartScreen warnings and antivirus false positives this app hits —
      # everything else (version resource, manifest, dropping the embedded
      # rclone payload) lowers the score, but only a signature actually
      # establishes a publisher identity.
      #
      # This step is skipped unless the secrets exist, so the workflow keeps
      # working for anyone without a certificate. To enable it: base64-encode
      # your .pfx into the WINDOWS_CERT_BASE64 secret and put its password in
      # WINDOWS_CERT_PASSWORD.
      - name: Sign executable
        if: ${{ env.SIGNING_CERT != '' && steps.version.outputs.exists != 'true' }}
        env:
          CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                      Where-Object { $_.FullName -like "*x64*" } |
                      Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 unreal_devtool.exe
          Remove-Item cert.pfx
          # Signing rewrites the file, so the checksum has to be recomputed.
          $h = (Get-FileHash unreal_devtool.exe -Algorithm SHA256).Hash.ToLower()
          "$h  unreal_devtool.exe" | Set-Content -NoNewline -Encoding ascii unreal_devtool.exe.sha256

      - name: Publish GitHub release
        if: ${{ steps.version.outputs.exists != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ steps.version.outputs.tag }}"
          body: |
            Automated build from commit ${{ github.sha }} on `main`.

            SHA-256 (`unreal_devtool.exe`): `${{ steps.hash.outputs.sha }}`

            Verify your download before running it:
            ```powershell
            Get-FileHash unreal_devtool.exe -Algorithm SHA256
            ```
          files: |
            unreal_devtool.exe
            unreal_devtool.exe.sha256
          make_latest: true
