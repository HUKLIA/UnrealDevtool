[package]
name = "unreal_devtool"
version = "1.0.1"
edition = "2024"

[dependencies]
eframe  = "0.29"                                 # GUI framework
winreg  = "0.52.0"                               # Find Unreal Engine via registry
rfd     = "0.14"                                 # Native file/folder picker
image   = { version = "0.25", features = ["gif"] } # GIF frame decoding
rodio   = { version = "0.22", default-features = false, features = ["playback", "mp3", "wav"] } # MP3/WAV playback
wry               = "0.40"                       # Embedded WebView2 (Cookie Clicker / Sponder Bird / 3D Miku)
raw-window-handle = "0.6"                        # Bridge winit's window handle to wry
ureq    = { version = "2.10", features = ["json", "tls"] } # GitHub release check / self-update download
serde   = { version = "1", features = ["derive"] }          # Parse GitHub release JSON
serde_json = { version = "1", features = ["preserve_order"] }                                             # Stream/parse Ollama & LM Studio chat chunks
sha2    = "0.10"                                 # Verify the self-update download against its published checksum
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"                              # Embed Windows version info + manifest + icon (see build.rs)

[profile.release]
opt-level   = 3       # full optimisation
lto         = true    # link-time optimisation across all crates
codegen-units = 1     # single codegen unit, enables better LTO
# `strip = true` was removed deliberately. A fully stripped, unsigned binary
# with no symbols and no metadata is a shape heuristic scanners treat as
# obfuscated; keeping the symbol table costs a little size and buys legitimacy.
# The version resource embedded by build.rs matters for the same reason.
strip       = "debuginfo"  # drop debug info, keep the symbol table
